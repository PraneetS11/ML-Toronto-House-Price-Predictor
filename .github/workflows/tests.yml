name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src app.py tests
      - run: ruff format --check src app.py tests
      - run: python -m pytest -q
      - run: house-price-train --output /tmp/house-price-model --reports /tmp/house-price-reports
